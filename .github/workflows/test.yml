name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launcher-contract:
    name: Launcher and contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run LunaMaxxing tests
        shell: pwsh
        run: ./tests/test-lunamaxxing.ps1
