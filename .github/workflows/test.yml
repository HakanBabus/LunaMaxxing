name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-orchestration:
    name: Native orchestration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run LunaMaxxing tests
        shell: pwsh
        run: ./tests/test-lunamaxxing.ps1

      - name: Run routing evals
        shell: pwsh
        run: ./evals/evaluate-routing.ps1
